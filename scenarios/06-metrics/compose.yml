name: metrics

services:
  graphite-statsd:
    container_name: graphite
    image: graphiteapp/graphite-statsd:1.1.10-5
    hostname: graphite-statsd
    restart: always
    ports:
      - "8080:80"
      - "8125:8125/udp"
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.11.3
    hostname: prometheus
    restart: always
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "9090:9090"
  spire-server:
    container_name: metrics-spire-server
    image: ghcr.io/spiffe/spire-server:1.14.5
    hostname: spire-server
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - spire-server-socket:/tmp/spire-server/private
    command: ["-config", "/opt/spire/conf/server/server.conf"]
  spire-agent:
    container_name: metrics-spire-agent
    image: ghcr.io/spiffe/spire-agent:1.14.5
    depends_on: ["spire-server"]
    hostname: spire-agent
    volumes:
      - ./spire/agent:/opt/spire/conf/agent
      - /var/run/:/var/run/
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
  tornjak-backend:
    container_name: metrics-tornjak-backend
    image: ghcr.io/spiffe/tornjak-backend:latest
    hostname: tornjak-backend
    depends_on: ["spire-server"]
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - ./tornjak:/run/tornjak
      - spire-server-socket:/tmp/spire-server/private
    command:
      - --spire-config
      - /opt/spire/conf/server/server.conf
      - --tornjak-config
      - /run/tornjak/tornjak.conf
    ports:
      - "10000:10000"
  tornjak-frontend:
    container_name: metrics-tornjak-frontend
    image: ghcr.io/spiffe/tornjak-frontend:latest
    hostname: tornjak-frontend
    depends_on: ["tornjak-backend"]
    environment:
      - REACT_APP_API_SERVER_URI=http://localhost:10000
    ports:
      - "3000:3000"

volumes:
  spire-server-socket:
