name: metrics

services:
  graphite-statsd:
    container_name: graphite
    image: graphiteapp/graphite-statsd:1.1.10-5
    hostname: graphite-statsd
    restart: always
    ports:
      - "8080:80"
      - "8125:8125/udp"
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.11.3
    hostname: prometheus
    restart: always
    volumes:
      - ./prometheus:/etc/prometheus
    ports:
      - "9090:9090"
  spire-server:
    container_name: metrics-spire-server
    image: ghcr.io/spiffe/spire-server:1.14.5
    hostname: spire-server
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - spire-server-socket:/tmp/spire-server/private
    command: ["-config", "/opt/spire/conf/server/server.conf"]
  spire-agent:
    container_name: metrics-spire-agent
    image: ghcr.io/spiffe/spire-agent:1.14.5
    depends_on: ["spire-server"]
    hostname: spire-agent
    volumes:
      - ./spire/agent:/opt/spire/conf/agent
      - /var/run/:/var/run/
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
  dashboard:
    container_name: metrics-dashboard
    image: spiffe-spire-demo-dashboard:local
    build:
      context: ../..
      dockerfile: dashboard/Containerfile
    hostname: dashboard
    user: "0"
    depends_on: ["spire-server"]
    volumes:
      - spire-server-socket:/tmp/spire-server/private
    ports:
      - "8090:8080"

volumes:
  spire-server-socket:
