name: svid-api

services:
  spire-server:
    container_name: svid-api-spire-server
    image: ghcr.io/spiffe/spire-server:1.14.5
    hostname: spire-server
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - spire-server-socket:/tmp/spire-server/private
    command: ["-config", "/opt/spire/conf/server/server.conf"]

  spire-agent:
    container_name: svid-api-spire-agent
    image: ghcr.io/spiffe/spire-agent:1.14.5
    hostname: spire-agent
    depends_on: ["spire-server"]
    volumes:
      - ./spire/agent:/opt/spire/conf/agent
      - workload-socket:/opt/spire/sockets
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-joinToken", "${SPIRE_AGENT_JOIN_TOKEN}"]

  svid-server:
    container_name: svid-api-svid-server
    image: spiffe-spire-demo-svid-server:local
    build:
      context: ../..
      dockerfile: scenarios/05-svid-api/server/Containerfile
    hostname: svid-server
    depends_on: ["spire-agent"]
    volumes:
      - workload-socket:/opt/spire/sockets
    environment:
      - PORT=8443

  svid-client:
    container_name: svid-api-svid-client
    image: spiffe-spire-demo-svid-client:local
    build:
      context: ../..
      dockerfile: scenarios/05-svid-api/client/Containerfile
    hostname: svid-client
    depends_on: ["svid-server"]
    volumes:
      - workload-socket:/opt/spire/sockets
    environment:
      - SERVER_URL=https://svid-server:8443

  tornjak-backend:
    container_name: svid-api-tornjak-backend
    image: ghcr.io/spiffe/tornjak-backend:v1.2.2
    hostname: tornjak-backend
    depends_on: ["spire-server"]
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - ./tornjak:/run/tornjak
      - spire-server-socket:/tmp/spire-server/private
    ports:
      - "10000:10000"

  tornjak-frontend:
    container_name: svid-api-tornjak-frontend
    image: ghcr.io/spiffe/tornjak-frontend:v1.2.2
    hostname: tornjak-frontend
    depends_on: ["tornjak-backend"]
    environment:
      - REACT_APP_API_SERVER_URI=http://localhost:10000
    ports:
      - "3000:3000"

volumes:
  workload-socket:
  spire-server-socket:
