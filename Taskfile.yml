# https://taskfile.dev
version: '3'

vars:
  SVID_API_DIR: scenarios/04-svid-api

tasks:
  build:
    desc: Build all Go binaries
    deps: [build-svid-server, build-svid-client]

  build-svid-server:
    desc: Build the SVID API server
    cmds:
      - go build -o {{.SVID_API_DIR}}/server/svid-server{{exeExt}} ./{{.SVID_API_DIR}}/server/
    sources:
      - "{{.SVID_API_DIR}}/server/**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.SVID_API_DIR}}/server/svid-server{{exeExt}}"

  build-svid-client:
    desc: Build the SVID API client
    cmds:
      - go build -o {{.SVID_API_DIR}}/client/svid-client{{exeExt}} ./{{.SVID_API_DIR}}/client/
    sources:
      - "{{.SVID_API_DIR}}/client/**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.SVID_API_DIR}}/client/svid-client{{exeExt}}"

  clean:
    desc: Remove all built binaries
    cmds:
      - cmd: rm -f {{.SVID_API_DIR}}/server/svid-server{{exeExt}}
        platforms: [linux, darwin]
      - cmd: rm -f {{.SVID_API_DIR}}/client/svid-client{{exeExt}}
        platforms: [linux, darwin]
      - cmd: if exist "{{.SVID_API_DIR}}\server\svid-server{{exeExt}}" del /f "{{.SVID_API_DIR}}\server\svid-server{{exeExt}}"
        platforms: [windows]
      - cmd: if exist "{{.SVID_API_DIR}}\client\svid-client{{exeExt}}" del /f "{{.SVID_API_DIR}}\client\svid-client{{exeExt}}"
        platforms: [windows]

  lint:
    desc: Run Go linter
    cmds:
      - go vet ./...

  test:
    desc: Run Go tests
    cmds:
      - go test ./...
